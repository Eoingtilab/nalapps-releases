name: NallaReview Verified Release

on:
  push:
    branches: [ main ]
    paths:
      - 'products/nalapps-place-autocomment/release-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nallareview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load release request
        id: request
        shell: pwsh
        run: |
          $r = Get-Content 'products/nalapps-place-autocomment/release-request.json' -Raw | ConvertFrom-Json
          if ($r.productId -ne 'nalapps-place-autocomment') { throw 'productId mismatch' }
          if (-not $r.version) { throw 'version missing' }
          if (-not $r.sourceSha) { throw 'sourceSha missing' }
          "version=$($r.version)" >> $env:GITHUB_OUTPUT
          "source_sha=$($r.sourceSha)" >> $env:GITHUB_OUTPUT
          "tag=utility-place-autocomment-v$($r.version)" >> $env:GITHUB_OUTPUT

      - name: Checkout verified source commit
        shell: pwsh
        run: |
          git clone --no-tags https://github.com/Eoingtilab/nalapps-palce-autocomment.git _source
          Push-Location _source
          git fetch --depth 1 origin ${{ steps.request.outputs.source_sha }}
          git checkout --detach ${{ steps.request.outputs.source_sha }}
          if ((git rev-parse HEAD).Trim() -ne '${{ steps.request.outputs.source_sha }}') { throw 'source SHA mismatch' }
          Pop-Location

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ISO 29119 / ISO 25010 quality gate
        shell: pwsh
        working-directory: _source
        run: python tools/quality-gate.py

      - name: Build, publish and self-test
        shell: pwsh
        working-directory: _source
        run: ./release.ps1 -Ci

      - name: Verify release package
        id: package
        shell: pwsh
        run: |
          $v = '${{ steps.request.outputs.version }}'
          $zip = "_source/artifacts/NallaReview-$v-win-x64.zip"
          $shaFile = "$zip.sha256"
          $selfTest = '_source/artifacts/self-test-release.txt'
          if (-not (Test-Path $zip)) { throw 'release zip missing' }
          if (-not (Test-Path $shaFile)) { throw 'sha256 file missing' }
          if (-not (Test-Path $selfTest)) { throw 'self-test report missing' }
          if (-not (Select-String -Path $selfTest -Pattern '^PASS_SELF_TEST$' -Quiet)) { throw 'self-test PASS marker missing' }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $declared) { throw 'SHA-256 mismatch' }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha_file=$shaFile" >> $env:GITHUB_OUTPUT
          "self_test=$selfTest" >> $env:GITHUB_OUTPUT
          "sha256=$actual" >> $env:GITHUB_OUTPUT
          "asset=NallaReview-$v-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.request.outputs.tag }}'
          $zip = '${{ steps.package.outputs.zip }}'
          $shaFile = '${{ steps.package.outputs.sha_file }}'
          $selfTest = '${{ steps.package.outputs.self_test }}'
          $notes = 'products/nalapps-place-autocomment/${{ steps.request.outputs.version }}/release-notes.md'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $shaFile $selfTest --clobber
          } else {
            gh release create $tag $zip $shaFile $selfTest --target $env:GITHUB_SHA --title "NallaReview v${{ steps.request.outputs.version }}" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed' }

      - name: Update stable manifest
        shell: pwsh
        run: |
          $v = '${{ steps.request.outputs.version }}'
          $tag = '${{ steps.request.outputs.tag }}'
          $asset = '${{ steps.package.outputs.asset }}'
          $sha = '${{ steps.package.outputs.sha256 }}'
          $manifestPath = 'products/nalapps-place-autocomment/latest.json'
          $manifest = [ordered]@{
            productId = 'nalapps-place-autocomment'
            version = $v
            channel = 'stable'
            downloadUrl = "https://github.com/Eoingtilab/nalapps-releases/releases/download/$tag/$asset"
            sha256 = $sha
            releaseNotesUrl = "https://github.com/Eoingtilab/nalapps-releases/blob/main/products/nalapps-place-autocomment/$v/release-notes.md"
            mandatory = $false
          }
          $manifest | ConvertTo-Json | Set-Content $manifestPath -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $manifestPath
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish NallaReview v$v stable manifest"
            git push origin HEAD:main
          }

      - name: Final release audit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.request.outputs.tag }}'
          $asset = '${{ steps.package.outputs.asset }}'
          $json = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($json.tagName -ne $tag) { throw 'release tag mismatch' }
          if ($json.isDraft -or $json.isPrerelease) { throw 'release is not stable' }
          if (-not ($json.assets.name -contains $asset)) { throw 'release ZIP asset missing' }
          if (-not ($json.assets.name -contains "$asset.sha256")) { throw 'release SHA asset missing' }
          if (-not ($json.assets.name -contains 'self-test-release.txt')) { throw 'release self-test asset missing' }
          Write-Host "RELEASE PASS: $tag / $asset" -ForegroundColor Green

      - name: Record release pipeline status
        if: always()
        shell: pwsh
        run: |
          $dir = 'products/nalapps-place-autocomment'
          $path = Join-Path $dir 'release-status.json'
          $status = [ordered]@{
            productId = 'nalapps-place-autocomment'
            version = '${{ steps.request.outputs.version }}'
            sourceSha = '${{ steps.request.outputs.source_sha }}'
            tag = '${{ steps.request.outputs.tag }}'
            jobStatus = '${{ job.status }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            runUrl = 'https://github.com/Eoingtilab/nalapps-releases/actions/runs/${{ github.run_id }}'
            recordedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $status | ConvertTo-Json | Set-Content $path -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record NallaReview release pipeline status"
            git pull --rebase origin main
            git push origin HEAD:main
          }
